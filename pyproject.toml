[project]
name = "genetics-results-api"
version = "0.1.0"
description = "API to fetch human genetics association results and annotations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.13.5",
    "asyncstdlib==3.14.0",
    "fastapi==0.136.1",
    "gcloud-aio-storage==9.6.4",
    "gcsfs==2026.4.0",
    "google-api-python-client==2.195.0",
    "google-cloud-logging==3.15.0",
    "google-cloud-storage==3.10.1",
    "polars==1.40.1",
    "PyJWT==2.12.1",
    "PyYAML>=6.0",
    "rapidfuzz==3.14.5",
    "requests==2.33.1",
    "typing-extensions==4.15.0",
    "uvicorn==0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-xdist==3.8.0",
    # pinned to match the siblings: the pre-commit lint gate is shared across the
    # suite, and two ruff versions mean the same file passes in one repo and fails
    # in the next
    "ruff==0.15.12",
]

# ruff only treats pyproject.toml as configuration when this table is present, so
# without it the `requires-python` above never reaches ruff and builtins added after
# the oldest supported version are reported undefined
[tool.ruff]
target-version = "py313"
# sibling worktrees live under .claude/worktrees and carry their own copy of every
# source file; without this, ruff reports each finding once per checked-out branch
exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501: line too long (handled by formatter)
# E402: module level import not at top of file (load_dotenv must be called before project imports)
# E741: ambiguous name (`l`) — style only, and every occurrence across the suite is a
#       loop variable, so it blocks commits without ever catching a defect
ignore = ["E501", "E402", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -rw"
markers = [
    "integration: reaches real data (GCS/tabix) over the network. Applied automatically to every test taking the `server_url` fixture; with no --server-url the app is booted in-process for these.",
    "offline: needs neither a server nor network. Applied automatically to every test that does not take `server_url`, so a new unmarked test lands here.",
]
